# Publishes @identvia/js and @identvia/react to npm when a version tag (v1.2.3) is pushed.
#
# Auth: npm trusted publishing (OIDC). Each package on npmjs.com -> Settings -> Trusted publishing ->
# GitHub Actions: organization/user "Identvia", repository "identvia-js", workflow "release.yml",
# environment "npm", allowed action "npm publish". Provenance is generated automatically.
# Bootstrap only (before the packages exist on npm): an optional NPM_TOKEN secret is used as a fallback.
# Delete that secret once trusted publishing is configured.
#
# A version that is already on npm is skipped, so re-running this workflow is safe.
# Run it manually (workflow_dispatch) for a dry run: it builds, tests, packs and runs `npm publish --dry-run`.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: release-npm, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, registry-url: 'https://registry.npmjs.org' }
      - name: npm 11.5.1+ is required for trusted publishing
        run: npm install -g npm@11 && npm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tag matches package versions
        if: github.ref_type == 'tag'
        run: |
          for p in packages/js packages/react; do
            v=$(node -p "require('./$p/package.json').version")
            [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::$p is $v but the tag is $GITHUB_REF_NAME"; exit 1; }
          done
      - name: Pack (pnpm rewrites workspace:* ranges)
        run: |
          mkdir -p "$RUNNER_TEMP/pkgs"
          for p in packages/js packages/react; do (cd $p && pnpm pack --pack-destination "$RUNNER_TEMP/pkgs"); done
          ls -l "$RUNNER_TEMP/pkgs"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.ref_type == 'tag' && '' || '--dry-run' }}
        run: |
          # @identvia/js first: @identvia/react has it as a peer dependency.
          for p in packages/js packages/react; do
            name=$(node -p "require('./$p/package.json').name"); ver=$(node -p "require('./$p/package.json').version")
            tgz="$RUNNER_TEMP/pkgs/$(echo "$name" | sed 's/^@//; s/\//-/')-$ver.tgz"
            if npm view "$name@$ver" version >/dev/null 2>&1; then echo "$name@$ver is already on npm; skipping"; continue; fi
            npm publish "$tgz" --access public --provenance $DRY_RUN
          done
